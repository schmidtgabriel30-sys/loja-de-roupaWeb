<form id="form-pedido">
    <label>E-mail:</label>
    <input type="email" id="contatante">

    <label>Nome:</label>
    <input type="text" id="empresa">

    <label>Cidadade:</label>
    <input type="text" id="cidade">

    <label>Estado:</label>
    <input type="text" id="estado">

    <label>Rua:</label>
    <input type="text" id="rua">

    <label>Bairro:</label>
    <input type="text" id="bairro">

    <label>Número:</label>
    <input type="text" id="numero">

    <label>Complemento:</label>
    <input type="text" id="complemento">

    <button type="submit">Enviar</button>
</form>

<script>
function mensagem_WhatsApp(){
    const form_carrinho = document.getElementById("form-pedido");

    form_carrinho.addEventListener('submit', function (evento) {
        evento.preventDefault(); // impede envio
        alert("Submit prevenido!");
    });



};  


mensagem_WhatsApp();
</script>
